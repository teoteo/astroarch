# Wayland preview: Plasma Login Manager autologin into Plasma Wayland.
# KRdp's RemoteAccess mode hands the physical seat to this login manager while an RDP client is connected.
# Relogin stays off: with Relogin=true an RDP connection spawns duplicate sessions (KDE bug 527191).
[Autologin]
User=astronaut
Session=plasma.desktop
Relogin=false
