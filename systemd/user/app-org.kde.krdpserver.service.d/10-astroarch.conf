# KRdp on the shared desktop, through KWin directly (no portal dialog), with a fixed certificate.
# RemoteFX instead of H.264: on a Pi it costs less CPU with a still screen, and KPipeWire's libx264
# stream (level 6.1) shows a white screen in clients that decode with OpenH264 (KDE bugs 526931, 500276).
[Unit]
PartOf=graphical-session.target

[Service]
Environment=KRDP_DISABLE_H264=1
ExecStart=
ExecStart=/usr/bin/krdpserver --plasma --mode SharedAccess --certificate /etc/astroarch/krdp/krdp.crt --certificate-key /etc/astroarch/krdp/krdp.key
Restart=on-failure
RestartSec=5
