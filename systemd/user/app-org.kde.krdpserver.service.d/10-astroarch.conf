# KRdp in RemoteAccess mode: the client gets a virtual screen sized to its window, which follows
# resizes, while the HDMI output shows the login screen. Through the desktop portal (no --plasma):
# with --plasma every pointer motion lands on (0,0) in a virtual screen (KDE bug 526783).
# RemoteFX instead of H.264: on a Pi it costs less CPU with a still screen, and KPipeWire's libx264
# stream (level 6.1) shows a white screen in clients that decode with OpenH264 (KDE bugs 526931, 500276).
[Unit]
PartOf=graphical-session.target

[Service]
Environment=KRDP_DISABLE_H264=1
ExecStart=
ExecStart=/usr/bin/krdpserver --mode RemoteAccess --certificate /etc/astroarch/krdp/krdp.crt --certificate-key /etc/astroarch/krdp/krdp.key
Restart=on-failure
RestartSec=5
